# ============================================================
# TFCL 同架构冒烟配置：先用少量数据 + 3 epoch 验证链路/显存
# 用法：拿到 GPU 后先跑这个，确认显存占用和每 epoch 时长
# ============================================================

data:
  root: data/asvspoof2019_la
  cache_dir: cache/tfcl_arch_smoke_v3
  sr: 16000

feature:
  type: raw
  duration: 4.0

afe:
  randomize: true               # now actually implemented: every stage
  jitter: 0.4                   # is jittered +-40% per utterance
  seed: 0
  stages: [aec, ns, agc, vad]

train:
  batch_size: 2                  # 冒烟刻意压小，测显存基线
  grad_accum: 1
  epochs: 3
  lr: 0.0001
  weight_decay: 0.0001
  max_grad_norm: 5.0
  early_stop_patience: 10
  eval_every: 1
  num_workers: 2
  fp16: true
  amp_dtype: bf16
  seed: 0
  view_schedule: random_stage
  stage_probs: [0.0, 0.25, 0.25, 0.25, 0.25]

wcl:
  lambda_mode: ratio             # 无量纲口径；abs 则直接用 lambda
  lambda: 0.3
  alpha: 0.3
  eps_init: 0.5
  eps_final: 0.1
  sinkhorn_iters: 20
  cost_mode: product            # 显式钉住：v4 的默认值已改为 product
  cost_normalize: mean           # cost/mean(cost): keeps mean_cost/eps in [2,10]
  use_temporal: true
  use_frequency: true

model:
  arch: xlsr_aasist
  # backend = transport measures computed on the AASIST frame output
  # (trainable, and the tensor the classifier pools over).
  # frontend = the frozen XLS-R states -> ZERO gradient (run 1 bug).
  measure_from: backend
  n_subbands: 8                 # hidden=128 -> 8 x 16 channels per band
  frontend:
    model_name: facebook/wav2vec2-xls-r-300m
    freeze: true
    layer_idx: -1
  backend:
    hidden: 128
    n_layers: 4
    n_heads: 4
    dropout: 0.1

eval:
  phases: [clean, aec, ns, agc, vad]
  batch_size: 2
  num_workers: 2

out_dir: outputs/tfcl_arch_smoke
