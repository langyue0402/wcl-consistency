# 临时验证配置：微型随机初始化 XLS-R（不下载 300M 权重）
# 仅用于在无 GPU / 无权重下载的机器上验证 raw 波形全链路，不可用于正式实验。
data:
  root: data/synth_asvspoof
  cache_dir: cache/tiny_verify_v3
  sr: 16000

feature:
  type: raw
  duration: 4.0

afe:
  randomize: true               # now actually implemented: every stage
  jitter: 0.4                   # is jittered +-40% per utterance
  seed: 0
  stages: [aec, ns, agc, vad]

train:
  batch_size: 2
  grad_accum: 1
  epochs: 2
  lr: 0.0001
  weight_decay: 0.0001
  max_grad_norm: 5.0
  early_stop_patience: 10
  eval_every: 1
  num_workers: 0
  fp16: false
  seed: 0
  view_schedule: random_stage
  stage_probs: [0.0, 0.25, 0.25, 0.25, 0.25]

wcl:
  lambda_mode: ratio             # 验证 ratio 标定路径
  lambda: 0.3
  alpha: 0.3
  eps_init: 0.5
  eps_final: 0.1
  sinkhorn_iters: 20
  cost_mode: product            # 显式钉住：v4 的默认值已改为 product
  cost_normalize: mean           # cost/mean(cost): keeps mean_cost/eps in [2,10]
  use_temporal: true
  use_frequency: true

model:
  arch: xlsr_aasist
  # backend = transport measures computed on the AASIST frame output
  # (trainable, and the tensor the classifier pools over).
  # frontend = the frozen XLS-R states -> ZERO gradient (run 1 bug).
  measure_from: backend
  n_subbands: 8                 # hidden=128 -> 8 x 16 channels per band
  frontend:
    pretrained: false
    freeze: true
    config_overrides:
      hidden_size: 64
      num_hidden_layers: 2
      num_attention_heads: 2
      intermediate_size: 128
      conv_dim: [32, 32]
      conv_stride: [10, 5]
      conv_kernel: [10, 3]
      num_conv_pos_embeddings: 16
      num_conv_pos_embedding_groups: 2
      feat_extract_norm: layer
  backend:
    hidden: 32
    n_layers: 2
    n_heads: 2
    dropout: 0.1

eval:
  phases: [clean, aec, ns, agc, vad]
  batch_size: 2
  num_workers: 0

out_dir: outputs/_tiny_verify
